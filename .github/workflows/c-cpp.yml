name: Build nanasm/nanvm

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows-mingw:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make

      - name: Configure CMake
        shell: msys2 {0}
        run: |
          cmake -S . -B build \
            -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++

      - name: Build
        shell: msys2 {0}
        run: |
          cmake --build build --config Release -j 4

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nanasm-nanvm-windows-mingw32
          path: |
            build/bin/*.exe
            build/bin/*.dll
          if-no-files-found: warn

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
        uses: ncipollo/release-action@v1
        with:
          artifacts: build/bin/*.exe,build/bin/*.dll
          generateReleaseNotes: true
          tag: ${{ github.ref_name }}-${{ github.run_number }}
          commit: ${{ github.sha }}
